# Déploiement de l'API Node.js
# Le step Cloud Build mettra à jour l'image finale via `kubectl set image`.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-node
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-node
  template:
    metadata:
      labels:
        app: api-node
    spec:
      containers:
        - name: api-node
          # L'image est remplacée après `kubectl apply` via `kubectl set image`.
          image: europe-west9-docker.pkg.dev/PROJECT_ID/api/api-image
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/netflix_db"

---

apiVersion: v1
kind: Service
metadata:
  name: api-node
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: api-node
